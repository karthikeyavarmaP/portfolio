<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A responsive task manager built with HTML, CSS and vanilla JavaScript.">
<meta name="theme-color" content="#18231f">
<title>Taskflow — Simple Task Manager</title>
<style>
:root{color-scheme:light;--bg:#f4f6f3;--panel:#fff;--ink:#18231f;--muted:#64716a;--line:#dfe6df;--accent:#246b52;--accent-light:#e4f2eb;--danger:#a43e3e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ef,#f8f7f2);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.shell{width:min(850px,92%);margin:0 auto;padding:48px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px}.brand{font-weight:850;font-size:1.1rem;letter-spacing:-.04em}.badge{font-size:.78rem;background:var(--accent-light);color:var(--accent);padding:6px 10px;border-radius:999px;font-weight:700}.intro h1{font-size:clamp(2.2rem,7vw,3.5rem);letter-spacing:-.06em;line-height:1.04;margin:0 0 12px}.intro p{color:var(--muted);margin:0 0 28px}.app{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,30px);box-shadow:0 16px 50px #18231f0b}.entry{display:flex;gap:10px}.entry input{flex:1;min-width:0;border:1px solid #cbd5cd;border-radius:12px;padding:13px 14px;font:inherit;outline-offset:3px}.entry button,.clear{border:0;border-radius:12px;background:var(--accent);color:white;font:inherit;font-weight:750;padding:12px 18px;cursor:pointer}.entry button:hover{filter:brightness(.92)}.stats{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:22px 0 14px}.stats strong{font-size:.95rem}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{border:1px solid transparent;background:transparent;border-radius:999px;padding:7px 11px;color:var(--muted);font:inherit;font-size:.88rem;cursor:pointer}.filters button[aria-pressed=true]{background:var(--accent-light);color:var(--accent);font-weight:750}.list{list-style:none;padding:0;margin:0}.task{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task input{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0}.task-text{flex:1;overflow-wrap:anywhere}.task.done .task-text{text-decoration:line-through;color:#89938c}.delete{border:0;background:transparent;color:var(--danger);font:inherit;font-size:.88rem;cursor:pointer;padding:7px}.empty{text-align:center;color:var(--muted);padding:34px 10px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:.85rem}.clear{background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 11px;font-size:.85rem}.back{display:inline-block;margin-top:24px;color:var(--accent);font-weight:700;text-decoration:none}.back:hover{text-decoration:underline}:focus-visible{outline:3px solid #b6d8c5;outline-offset:3px}@media(max-width:520px){.shell{padding:28px 0}.entry{flex-direction:column}.entry button{width:100%}.stats{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand">Taskflow<span style="color:#246b52">.</span></div><span class="badge">Frontend project</span></header>
<section class="intro"><h1>Make room for<br>what matters.</h1><p>A lightweight task manager to capture tasks, track progress, and stay focused.</p></section>
<section class="app" aria-label="Task manager">
<form class="entry" id="task-form"><label for="task-input" hidden>Add a task</label><input id="task-input" maxlength="140" placeholder="What do you need to do?" autocomplete="off" required><button type="submit">Add task +</button></form>
<div class="stats"><strong id="task-count" aria-live="polite">0 tasks left</strong><div class="filters" role="group" aria-label="Filter tasks"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="completed" aria-pressed="false">Completed</button></div></div>
<ul class="list" id="task-list"></ul>
<div class="bottom"><span>Tasks are saved in this browser on this device.</span><button class="clear" id="clear-completed" type="button">Clear completed</button></div>
</section>
<a class="back" href="./index.html">← Back to Karthikeyavarma's portfolio</a>
</main>
<script>
(() => {
  const STORAGE_KEY = "taskflow.tasks.v1";
  const form = document.querySelector("#task-form");
  const input = document.querySelector("#task-input");
  const list = document.querySelector("#task-list");
  const count = document.querySelector("#task-count");
  const clearButton = document.querySelector("#clear-completed");
  const filterButtons = [...document.querySelectorAll("[data-filter]")];
  let filter = "all";
  let tasks = [];
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (Array.isArray(saved)) tasks = saved.filter(t => t && typeof t.id === "string" && typeof t.text === "string" && typeof t.completed === "boolean");
  } catch { tasks = []; }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
    catch { /* The app remains usable if browser storage is unavailable. */ }
  }
  function render() {
    const remaining = tasks.filter(t => !t.completed).length;
    count.textContent = remaining + (remaining === 1 ? " task left" : " tasks left");
    filterButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.filter === filter)));
    const visible = tasks.filter(t => filter === "all" || (filter === "active" && !t.completed) || (filter === "completed" && t.completed));
    list.replaceChildren();
    if (!visible.length) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = tasks.length ? "Nothing in this filter yet." : "No tasks yet. Add one above to get started.";
      list.append(empty);
      return;
    }
    visible.forEach(task => {
      const item = document.createElement("li");
      item.className = "task" + (task.completed ? " done" : "");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.completed;
      checkbox.setAttribute("aria-label", "Mark " + task.text + " as " + (task.completed ? "active" : "completed"));
      checkbox.addEventListener("change", () => {
        task.completed = checkbox.checked;
        save();
        render();
      });
      const text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;
      const remove = document.createElement("button");
      remove.className = "delete";
      remove.type = "button";
      remove.textContent = "Delete";
      remove.setAttribute("aria-label", "Delete task: " + task.text);
      remove.addEventListener("click", () => {
        tasks = tasks.filter(t => t.id !== task.id);
        save();
        render();
      });
      item.append(checkbox, text, remove);
      list.append(item);
    });
  }
  form.addEventListener("submit", event => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2), text, completed: false });
    save();
    input.value = "";
    render();
    input.focus();
  });
  filterButtons.forEach(button => button.addEventListener("click", () => {
    filter = button.dataset.filter;
    render();
  }));
  clearButton.addEventListener("click", () => {
    tasks = tasks.filter(task => !task.completed);
    save();
    render();
  });
  render();
})();
</script>
</body>
</html>
